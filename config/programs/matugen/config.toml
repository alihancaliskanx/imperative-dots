[config]
reload_apps = false

[templates.quickshell]
input_path = "~/.config/matugen/templates/qs_colors.json.template"
output_path = "/tmp/qs_colors.json"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf.template"
output_path = "/tmp/kitty-matugen-colors.conf"

[templates.discord]
input_path = "~/.config/matugen/templates/discord.css.template"
output_path = "~/.config/vesktop/themes/matugen.theme.css"

[templates.firefox]
input_path = "~/.config/matugen/templates/firefox.css"
output_path = "~/.mozilla/firefox/zawmoi9h.default/chrome/matugen.css"

[templates.web_github]
input_path = "~/.config/matugen/templates/websites/github.css.template"
output_path = "~/.mozilla/firefox/zawmoi9h.default/chrome/matugen-github.css"

[templates.web_youtube]
input_path = "~/.config/matugen/templates/websites/youtube.css.template"
output_path = "~/.mozilla/firefox/zawmoi9h.default/chrome/matugen-youtube.css"

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim-colors.lua.template"
output_path = "~/.config/nvim/matugen_colors.lua"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.ini.template"
output_path = "~/.config/cava/colors"

[templates.swayosd]
input_path = "~/.config/matugen/templates/swayosd.css.template"
output_path = "~/.config/swayosd/style.css"

[templates.gtk]
input_path = "~/.config/matugen/templates/gtk.css.template"
output_path = "~/.cache/matugen/colors-gtk.css"

# The cache copy above is all upstream generated; on NixOS home-manager pulled it
# into gtk.css with an extraCss import. Arch has no equivalent, so nothing ever
# read it and every GTK app ignored the wallpaper.
#
# The colours go beside the files GTK actually reads instead. Not into gtk.css
# itself: that file is the static rainynight theme and defines window_bg_color
# and its neighbours from its own palette, so an import at the top -- where CSS
# wants it -- would lose to them. gtk.css imports this on its last line, after
# those definitions, which is where it wins.
[templates.gtk3_local]
input_path = "~/.config/matugen/templates/gtk.css.template"
output_path = "~/.config/gtk-3.0/matugen.css"

# GTK4 gets the modern spelling. libadwaita has taken its colours from CSS
# custom properties since 1.6 and ignores the @define-color names, so on
# libadwaita 1.9 the old template themed nothing -- measured: a themed gtk.css
# still left the editor on stock #1d1d20 instead of the wallpaper's #101418.
[templates.gtk4_local]
input_path = "~/.config/matugen/templates/gtk4-adw.css.template"
output_path = "~/.config/gtk-4.0/matugen.css"

# The qt5ct/qt6ct palettes below only reach Qt apps that use the platform
# theme's palette. KF6 applications do not: dolphin reads kdeglobals and
# ignores qt6ct entirely (KDE_COLOR_SCHEME_PATH does not move it either), so
# this is the entry that actually colours it from the wallpaper.
#
# ~/.config/kdeglobals is a symlink to the dotfiles repo under the other rice,
# and matugen writes *through* symlinks -- so link.sh unlinks its `kdeglobals`
# package before this rice runs, and deletes what is generated here on the way
# back out. Adding an output that lands on a tracked path without that pairing
# would overwrite the file in the repo instead of shadowing it.
[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kdeglobals.template"
output_path = "~/.config/kdeglobals"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct.conf.template"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct.conf.template"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5_style]
input_path = "~/.config/matugen/templates/qt-style.qss.template"
output_path = "~/.config/qt5ct/qss/matugen-style.qss"

[templates.qt6_style]
input_path = "~/.config/matugen/templates/qt-style.qss.template"
output_path = "~/.config/qt6ct/qss/matugen-style.qss"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.conf.template'
output_path = '~/.config/hypr/colors.conf'



[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi.template'
output_path = '~/.config/rofi/theme.rasi'
