# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Merged with the bindings from my own hyprland.conf. The rule: a key I already
# had keeps doing what it did, and the shell widget that wanted it moves to the
# Shift variant. Nothing was dropped, so both halves stay reachable.
#
#   Mod+W  close window      Mod+Shift+W  wallpaper picker
#   Mod+Q  window list       Mod+Shift+Q  music
#   Mod+V  clipboard paste   Mod+Shift+V  volume
#   Mod+B  browser           Mod+Shift+B  power menu
#   Mod+M  Spotify           Mod+Shift+M  monitors
#   Mod+S  scratchpad        Mod+Shift+S  screenshot (region)
#   Mod+F  fullscreen        Mod+T        float
#
# Second-round collisions, where the Shift slot was taken as well:
#   calendar  Mod+Shift+K   (Mod+S is the scratchpad, Mod+C the clipboard panel)
#   settings  Mod+Shift+O   (Mod+Shift+S is the screenshot)
#
# Dropped on purpose: the firefox and Telegram launchers — Mod+B already opens
# the default browser and Mod+D is an app launcher, so a key each was waste.
# Also Mod+Shift+F (float), which Mod+T does.

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ───────── Windows ─────────
bind = $mainMod, W, killactive
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, X, fullscreen, 1          # maximize, KDE's Meta+PgUp
bind = $mainMod, T, togglefloating
bind = $mainMod, P, pin                    # keep a floating window on every workspace
bind = $mainMod SHIFT, C, centerwindow
bind = $mainMod, U, focusurgentorlast      # jump to whatever is asking for attention
bind = $mainMod, A, bringactivetotop       # raise a floating window above the others
bind = $mainMod CTRL, ESCAPE, forcekillactive

# Groups: windows stacked behind one tab bar.
bind = $mainMod, Z, togglegroup
bind = $mainMod SHIFT, Z, changegroupactive, f
bind = $mainMod CTRL, Z, moveoutofgroup
bind = $mainMod ALT, Z, moveintogroup, r

# Arrows carry every window operation, so nothing depends on a character key —
# the layout here is Turkish and keysyms are not where a US layout puts them.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod ALT, left,  resizeactive, -60 0
binde = $mainMod ALT, right, resizeactive,  60 0
binde = $mainMod ALT, up,    resizeactive,  0 -60
binde = $mainMod ALT, down,  resizeactive,  0 60

# ───────── Switching ─────────
# A tap of Alt+Tab returns to the last window rather than walking the list, as
# in KDE; Alt+Shift+Tab keeps the cycling. Mod+Q lists every window
# on every workspace through fuzzel.
bind = ALT, TAB, exec, hyprctl --batch "dispatch focuscurrentorlast; dispatch bringactivetotop"
bind = ALT SHIFT, TAB, exec, hyprctl --batch "dispatch cyclenext; dispatch bringactivetotop"
bind = $mainMod, Q, exec, bash ~/.config/hypr/scripts/window-switcher.sh

# Super+Tab: the graphical switcher, KDE/Windows style — hold Super, tap Tab or
# the arrows to walk a strip of live window previews, release Super to switch.
#
# Only the opening is bound here. Once it is up the switcher takes an exclusive
# keyboard grab and reads the rest itself, including the Super release that
# confirms — Hyprland cannot report that release reliably while its own
# modifier is still held, which is what a submap attempt ran into.
bind = $mainMod, TAB, exec, bash ~/.config/hypr/scripts/switcher.sh open

# While it is up, these keys belong to the switcher. Note there is no binding
# for releasing Super here: Hyprland does not report that reliably while Super
# is the modifier holding the submap open, so the switcher watches for it
# itself through its keyboard grab and dispatches `submap reset` on the way out.
submap = switcher
bind = $mainMod, TAB, exec, bash ~/.config/hypr/scripts/switcher.sh next
bind = $mainMod SHIFT, TAB, exec, bash ~/.config/hypr/scripts/switcher.sh prev
bind = $mainMod, right, exec, bash ~/.config/hypr/scripts/switcher.sh next
bind = $mainMod, left,  exec, bash ~/.config/hypr/scripts/switcher.sh prev
bind = , right, exec, bash ~/.config/hypr/scripts/switcher.sh next
bind = , left,  exec, bash ~/.config/hypr/scripts/switcher.sh prev
bind = , escape, exec, bash ~/.config/hypr/scripts/switcher.sh cancel
submap = reset

# ───────── Scratchpad ─────────
# A workspace that overlays the current one instead of replacing it.
bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod SHIFT, RETURN, movetoworkspacesilent, special:scratch

# ───────── Applications ─────────
bind = $mainMod, RETURN, exec, $terminal
# The bar's search icon opens this same widget; Alt+Space is the muscle memory
# for it. fuzzel is still what the clipboard picker and window-switch use.
bind = ALT, SPACE, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, B, exec, gtk-launch $(xdg-settings get default-web-browser)
bind = $mainMod, E, exec, dolphin
bind = $mainMod, M, exec, flatpak run com.spotify.Client
bind = CTRL ALT, SPACE, exec, claude-desktop
bind = $mainMod, F1, exec, hotkeys
bind = $mainMod SHIFT, P, exec, power-profile
bind = $mainMod, V, exec, sh -c 'cliphist decode "$(cliphist list | fuzzel --dmenu)" | wl-copy'

# ───────── Session ─────────
bind = $mainMod SHIFT, H, exec, sh -c '[ "$(printf "No\nYes" | fuzzel --dmenu --prompt "Quit Hyprland? " --lines 2)" = Yes ] && hyprctl dispatch exit'
bind = CTRL ALT, DELETE, exec, sh -c '[ "$(printf "No\nYes" | fuzzel --dmenu --prompt "Quit Hyprland? " --lines 2)" = Yes ] && hyprctl dispatch exit'
bindel = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh

# ───────── Screenshots ─────────
bindl = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = SUPER SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ───────── Media & Hardware ─────────
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindl = , xf86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bindel = , xf86audiolowervolume, exec, swayosd-client --output-volume lower
bindel = , xf86audioraisevolume, exec, swayosd-client --output-volume raise

# ───────── Shell widgets ─────────
# The ones whose plain-Mod key I use for something else sit on Shift.
bind = $mainMod, D, exec, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, C, exec, ~/.config/hypr/scripts/qs_manager.sh toggle clipboard
bind = $mainMod, N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle guide
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/reload.sh
bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = $mainMod SHIFT, Q, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = $mainMod SHIFT, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle volume
bind = $mainMod SHIFT, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = $mainMod SHIFT, B, exec, bash ~/.config/hypr/scripts/power-menu.sh
bind = $mainMod SHIFT, T, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle focustime
bind = $mainMod SHIFT, K, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = $mainMod SHIFT, O, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings

# ───────── Workspaces ─────────
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9

bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1 move
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2 move
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3 move
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4 move
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5 move
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6 move
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7 move
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8 move
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9 move

# Up/down walk the workspaces, left/right cross to the other monitor. KDE bound
# all four arrows to workspaces, but that spent two keys on a duplicate — the
# vertical pair already does it — and left no arrow for monitors at all.
bind = $mainMod CTRL, up,    workspace, e-1
bind = $mainMod CTRL, down,  workspace, e+1
bind = $mainMod CTRL, left,  focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r

# Same split with Shift: drag the window along.
bind = $mainMod CTRL SHIFT, up,    movetoworkspace, e-1
bind = $mainMod CTRL SHIFT, down,  movetoworkspace, e+1
bind = $mainMod CTRL SHIFT, left,  movewindow, mon:l
bind = $mainMod CTRL SHIFT, right, movewindow, mon:r
