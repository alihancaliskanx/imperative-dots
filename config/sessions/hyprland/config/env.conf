#  ◈ ENVIRONMENT VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Upstream sets NIXOS_OZONE_WL, which only NixOS' Electron wrappers read. The
# portable spelling is the one Electron itself understands.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# The wallpaper picker and qs_manager.sh both fall back to ~/Pictures/Wallpapers
# when this is unset; naming it here keeps the two in step.
env = WALLPAPER_DIR,$HOME/Pictures/Wallpapers

# Qt apps -- dolphin above all -- have no styling of their own outside Plasma.
# Upstream handled this in home.nix with qt6ct, which home-manager sets up and
# this machine does not have; nothing here was setting a platform theme at all,
# so on a clean login into this rice dolphin came up as unstyled grey.
#
# `kde` reads ~/.config/kdeglobals, which the dotfiles `theme` package links and
# which stays linked under this rice too (link.sh only takes hypr, desktop and
# cli away), so it needs no extra package and matches what the other rice does.
# XDG_MENU_PREFIX is what lets KDE apps find /etc/xdg/menus/plasma-applications.menu
# for their "Open With" lists.
#
# matugen does still write ~/.config/qt{5,6}ct/colors/matugen.conf on every
# theme change. Installing qt6ct and pointing this at it instead is what would
# make dolphin follow the wallpaper rather than the rainynight palette.
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_MENU_PREFIX,plasma-

# Scripts and launchers that offer to "open the folder" read this.
env = FILEMANAGER,dolphin
