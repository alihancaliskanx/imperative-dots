#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Rewritten for Hyprland 0.56, which takes `property value, match:field regex`.
# Every rule in here used the older form and the whole file was rejected line by
# line at startup. Three properties were also renamed and were reported as
# "invalid field type" even once the new form was used:
#
#   noanim           →  animation none
#   ignorealpha 0.2  →  ignore_alpha 0.2
#   keepaspectratio  →  keep_aspect_ratio true
#
# Each line below was checked against the running compositor with
# `hyprctl keyword ...` before being written here.

# ─────────────────────────────
# Layer rules (OSD / overlays)
# ─────────────────────────────
layerrule = animation none, match:namespace ^(volume_osd)$
layerrule = animation none, match:namespace ^(brightness_osd)$
layerrule = animation none, match:namespace hyprpicker
layerrule = animation none, match:namespace qsdock
layerrule = blur true, match:namespace ext-session-lock
layerrule = ignore_alpha 0.2, match:namespace ext-session-lock

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── CS2 ─────────
windowrule = immediate true, match:class ^(cs2)$
windowrule = keep_aspect_ratio true, match:class ^(cs2)$

# ───────── App Launcher ─────────
windowrule = float true, match:title ^(app-launcher)$
windowrule = center true, match:title ^(app-launcher)$
windowrule = size 1200 600, match:title ^(app-launcher)$
windowrule = animation slide, match:title ^(app-launcher)$

# ───────── MASTER QUICKSHELL CONTAINER ─────────
# All widgets now live inside this single, shape-shifting window.
